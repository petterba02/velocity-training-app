<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Velocity">
  <title>Vertical Velocity</title>
  <style>
    [hidden] { display: none !important; }
    body {
      font-family: -apple-system, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
      box-sizing: border-box;
      gap: 16px;
    }
    h1 { font-size: 22px; margin: 0; }
    .big { font-size: 72px; font-variant-numeric: tabular-nums; font-weight: 600; }
    .unit { font-size: 18px; color: #aaa; margin-top: -12px; }
    .row { display: flex; gap: 12px; align-items: center; }
    label { color: #aaa; font-size: 16px; }
    select {
      font-size: 18px;
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      background: #3a3a3c;
      color: #fff;
    }
    ol#peaks {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 220px;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }
    ol#peaks li {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #2c2c2e;
    }
    ol#peaks li span:first-child { color: #aaa; }
    button {
      font-size: 18px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: #0a84ff;
      color: #fff;
    }
    button.secondary { background: #3a3a3c; }
    #status { color: #aaa; font-size: 14px; text-align: center; padding: 0 20px; }
  </style>
</head>
<body>
  <h1>Vertical Velocity</h1>
  <div class="big" id="vel">0.00</div>
  <div class="unit">m/s</div>

  <div class="row">
    <label for="topN">Show top</label>
    <select id="topN"></select>
    <label for="topN">peaks</label>
  </div>
  <ol id="peaks"></ol>

  <button id="start">Start</button>
  <div class="row" id="controls" hidden>
    <button id="calibrate">Calibrate</button>
    <button id="resetPeaks" class="secondary">Reset peaks</button>
  </div>
  <div id="status"></div>

  <script>
    const SAMPLE_MS = 1000;       // calibration averaging time
    const CAL_SPREAD = 0.15;      // max movement (m/s²) allowed while calibrating
    const STILL_ACC = 0.15;       // below this (m/s²) the phone counts as "still"
    const STILL_MS = 250;         // how long it must be still before velocity resets to 0
    const REP_START = 0.15;       // m/s: upward speed that starts a peak
    const REP_END = 0.05;         // m/s: speed below which the peak is finished
    const REP_MIN = 0.20;         // m/s: peaks slower than this are ignored as noise

    const $ = (id) => document.getElementById(id);
    const status = $("status");

    // Selector for how many peaks to show
    for (let i = 1; i <= 10; i++) {
      const o = document.createElement("option");
      o.value = i; o.textContent = i;
      $("topN").appendChild(o);
    }
    let topN = 3;
    try {
      const n = parseInt(localStorage.getItem("topN"), 10);
      if (n >= 1 && n <= 10) topN = n;
    } catch (e) {}
    $("topN").value = topN;

    let bias = { x: 0, y: 0, z: 0 };
    try {
      const saved = JSON.parse(localStorage.getItem("bias"));
      if (saved) bias = saved;
    } catch (e) {}

    let grav = null;              // smoothed gravity direction (device frame)
    let v = 0;                    // vertical velocity, m/s
    let lastT = null;
    let stillMs = 0;
    let sampling = null;

    let peaks = [];               // one entry (m/s) per finished upward movement
    let inRep = false;
    let repMax = 0;

    function renderPeaks() {
      const top = peaks.slice().sort((a, b) => b - a).slice(0, topN);
      $("peaks").innerHTML = top
        .map((p, i) => "<li><span>" + (i + 1) + "</span><span>" + p.toFixed(2) + " m/s</span></li>")
        .join("");
    }

    function render() {
      $("vel").textContent = v.toFixed(2);
    }

    function trackPeaks() {
      if (!inRep) {
        if (v > REP_START) { inRep = true; repMax = v; }
      } else {
        if (v > repMax) repMax = v;
        if (v < REP_END) {
          inRep = false;
          if (repMax >= REP_MIN) {
            peaks.push(repMax);
            renderPeaks();
          }
        }
      }
    }

    function handleMotion(e) {
      const a = e.acceleration;                       // gravity removed
      const ag = e.accelerationIncludingGravity;      // gravity included
      if (!a || !ag || a.x === null || ag.x === null) return;

      const now = performance.now();
      const dt = lastT === null ? 0 : Math.min((now - lastT) / 1000, 0.1);
      lastT = now;

      if (sampling) sampling.push({ x: a.x, y: a.y, z: a.z });

      // Linear acceleration with sensor bias removed
      const ax = a.x - bias.x, ay = a.y - bias.y, az = a.z - bias.z;

      // Gravity direction = difference of the two readings, lightly smoothed
      const g = { x: ag.x - a.x, y: ag.y - a.y, z: ag.z - a.z };
      if (!grav) grav = g;
      else {
        grav.x += 0.2 * (g.x - grav.x);
        grav.y += 0.2 * (g.y - grav.y);
        grav.z += 0.2 * (g.z - grav.z);
      }
      const gl = Math.hypot(grav.x, grav.y, grav.z);
      if (gl < 5) return;                             // gravity estimate not valid

      // Component of acceleration along the vertical axis (m/s², up is positive)
      const vert = (ax * grav.x + ay * grav.y + az * grav.z) / gl;

      // Zero-velocity update: if the phone is still, reset velocity to stop drift
      const total = Math.hypot(ax, ay, az);
      stillMs = total < STILL_ACC ? stillMs + dt * 1000 : 0;

      if (stillMs > STILL_MS) v = 0;
      else v += vert * dt;

      trackPeaks();
      render();
    }

    async function keepAwake() {
      try { await navigator.wakeLock.request("screen"); } catch (e) {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && !$("controls").hidden) keepAwake();
    });

    $("topN").addEventListener("change", () => {
      topN = parseInt($("topN").value, 10);
      try { localStorage.setItem("topN", String(topN)); } catch (e) {}
      renderPeaks();
    });

    $("start").addEventListener("click", async () => {
      try {
        if (typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function") {
          const result = await DeviceMotionEvent.requestPermission();
          if (result !== "granted") {
            status.textContent = "Motion permission denied.";
            return;
          }
        }
        window.addEventListener("devicemotion", handleMotion);
        keepAwake();
        $("start").hidden = true;
        $("controls").hidden = false;
        status.textContent = "Place the phone still, then tap Calibrate.";
      } catch (err) {
        status.textContent = "Error: " + err.message;
      }
    });

    $("calibrate").addEventListener("click", () => {
      if (sampling) return;
      sampling = [];
      status.textContent = "Calibrating... keep the phone still.";

      setTimeout(() => {
        const s = sampling;
        sampling = null;
        if (s.length < 5) { status.textContent = "Not enough data. Try again."; return; }

        const mean = (k) => s.reduce((sum, p) => sum + p[k], 0) / s.length;
        const spread = (k) =>
          Math.max(...s.map((p) => p[k])) - Math.min(...s.map((p) => p[k]));

        if (Math.max(spread("x"), spread("y"), spread("z")) > CAL_SPREAD) {
          status.textContent = "The phone moved. Place it still and try again.";
          return;
        }
        bias = { x: mean("x"), y: mean("y"), z: mean("z") };
        try { localStorage.setItem("bias", JSON.stringify(bias)); } catch (e) {}
        v = 0; peaks = []; inRep = false;
        render(); renderPeaks();
        status.textContent = "Calibrated. Ready.";
      }, SAMPLE_MS);
    });

    $("resetPeaks").addEventListener("click", () => {
      peaks = []; inRep = false; v = 0;
      render(); renderPeaks();
      status.textContent = "Peaks cleared.";
    });

    renderPeaks();
  </script>
</body>
</html>
